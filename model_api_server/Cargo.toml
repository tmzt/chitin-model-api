[package]
name = "model_api_server"
version = "0.1.0"
edition = "2021"

# Binary: the model_api UDS server. Holds a single global llama.cpp
# `Session` + smart KV cache, queues incoming requests behind it, and
# responds over UDS using the wire types from `model_api_proto`.
#
# Build only when llama-cpp is available. Mirrors `thinker_impl`'s
# `llama-cpp` feature so the GPU-only build doesn't drag in
# llama_engine.

[[bin]]
name = "chitin-model-api"
path = "src/main.rs"

[features]
# Default is no backend, so the workspace can build the lib + run
# its E2E tests (StubSlot only) without paying the llama-cpp dep
# tree cost. Enable `llama-cpp` explicitly for the production binary
# — that's what `make run-modelapi` does.
default = []

# Real backend: pulls thinker_impl with its `llama-cpp` feature so
# the server's LlamaSlot can call spawn_resource and own the slot.
# Also pulls common + llama-cpp-2 transitively. Mirrors
# thinker_impl's same-named feature.
llama-cpp = ["dep:thinker_impl", "dep:common"]

# LiteRT-LM backend for the Pixel demo (PowerVR OpenCL).
# Build the C shared library out of band:
#   cd deps/litert-lm
#   bazelisk build --config=android_arm64 //c:libLiteRtLmC.so
# Then point cargo at it:
#   LITERT_LM_LIB_DIR=$(realpath deps/litert-lm/bazel-bin/c) \
#   cargo build -p model_api_server --features litert-lm \
#         --target aarch64-linux-android
# litert-sys (the TFLite runtime, pulled transitively) auto-downloads
# its libLiteRt.so from Google Maven AAR for android_arm64.
litert-lm = ["dep:litertlm", "dep:litert-lm-sys"]

[lib]
path = "src/lib.rs"

[dependencies]
model_api_proto = { path = "../model_api_proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "1.3" }
smol = "2"
async-channel = "2"
async-trait = "0.1"
futures-lite = "2"
log = "0.4"
env_logger = "0.11"

# Backend wiring — present only with the `llama-cpp` feature.
thinker_impl = { path = "../thinker_impl", features = ["llama-cpp"], optional = true }
common = { path = "../common", optional = true }

# Backend wiring — present only with the `litert-lm` feature.
# Path-dep on our local fork (deps/litert-rs) so we can:
#   1. Vendor litert-lm v0.13.1 headers (the published 0.2.1 crate
#      hardcodes v0.10.2 which can't load current Gemma-4 .litertlm
#      files).
#   2. Use the 6-arg `litert_lm_conversation_send_message_stream`
#      signature with `LiteRtLmConversationOptionalArgs*` for
#      `visual_token_budget` (required for multimodal Gemma-4 even
#      on pure-text sends).
# Toggle the `litert-lm-sys/generate-bindings` feature so bindgen
# regenerates the FFI at build time against the v0.13.1 header.
litertlm = { path = "../deps/litert-rs/litert-lm", optional = true }
litert-lm-sys = { path = "../deps/litert-rs/litert-lm-sys", features = ["generate-bindings"], optional = true }
