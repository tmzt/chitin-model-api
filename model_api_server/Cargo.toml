[package]
name = "model_api_server"
version = "0.1.0"
edition = "2021"

# Binary: the model_api UDS server. Holds a single global llama.cpp
# `Session` + smart KV cache, queues incoming requests behind it, and
# responds over UDS using the wire types from `model_api_proto`.
#
# Build only when llama-cpp is available. Mirrors `thinker_impl`'s
# `llama-cpp` feature so the GPU-only build doesn't drag in
# llama_engine.

[[bin]]
name = "chitin-model-api"
path = "src/main.rs"

[features]
default = ["llama-cpp"]

# Pull in llama_engine + the llama-cpp-2 path dep. Mirrors
# thinker_impl's same-named feature so the workspace can build either
# with or without the GGUF backend.
llama-cpp = ["dep:llama_engine", "dep:llama-cpp-2"]

[lib]
path = "src/lib.rs"

[dependencies]
model_api_proto = { path = "../model_api_proto" }
serde = { version = "1", features = ["derive"] }
bincode = { version = "1.3" }
smol = "2"
async-channel = "2"
async-trait = "0.1"
futures-lite = "2"
log = "0.4"
env_logger = "0.11"

# Backend wiring — present only with the `llama-cpp` feature.
llama_engine = { path = "../llama_engine", optional = true }
llama-cpp-2 = { path = "../deps/llama-cpp-2/llama-cpp-2", features = ["sampler"], optional = true }
